version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
    groups:
      all:
        patterns: ["*"]

  # Dev tooling only (linters, test runners); the site has no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["*"]
