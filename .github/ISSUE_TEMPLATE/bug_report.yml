name: Bug report
description: Something on the site is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL or route where it happens, e.g. `#/labs/decomp/d3`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on macOS, Safari on iPhone 15…
